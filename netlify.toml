# Divine Empress Hair - Netlify deployment config
# Netlify auto-detects Next.js (App Router) and uses the Next.js Runtime
# for SSR, API routes (/api/*), and image optimization.

[build]
  command = "npm run build"
  publish = ".next"
  SECRETS_SCAN_OMIT_PATHS = "path/to/file"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache Next.js build output for faster deploys
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for the whole site
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200